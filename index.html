<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47721"><meta name="apple-mobile-web-app-capable" content="yes">
<title>FOSELEV VFG 1.0.0</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.svg"><meta name="description" content="Application FOSELEV de visites de fin de garantie">
<link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div><div class="eyebrow">FOSELEV · V0.6.2</div><h1>Visites de fin de garantie</h1></div><button id="install" class="btn secondary hidden">Installer</button></header>
<main class="wrap">
<section id="s-search" class="screen active"><div class="card"><h2>Rechercher un matériel</h2><label>Recherche globale</label><input id="q" type="search" placeholder="N° parc, immatriculation, série, modèle, société…"><div class="grid2"><div><label>Société</label><select id="company"><option value="">Toutes les sociétés</option></select></div><div><label>Agence</label><select id="agency"><option value="">Toutes les agences</option></select></div></div><div class="cats"><label class="chip"><input class="cat" type="checkbox" value="GM" checked>GM</label><label class="chip"><input class="cat" type="checkbox" value="CB" checked>CB</label><label class="chip"><input class="cat" type="checkbox" value="CN" checked>CN</label></div></div><div class="heading"><h2>Résultats</h2><span id="count" class="badge">0</span></div><div id="results" class="results"></div></section>
<section id="s-machine" class="screen"><button class="back" data-go="search">← Retour</button><div id="machineCard" class="card"></div><button id="newVisit" class="btn primary full">Créer une nouvelle visite</button><div class="card" style="margin-top:14px"><h3>Historique de ce matériel</h3><div id="machineHistory"></div></div></section>
<section id="s-visit" class="screen"><button class="back" data-go="machine">← Retour</button><div class="card"><h2>Nouvelle visite</h2><div id="visitSummary" class="summary"></div><div class="grid2"><div><label>Date</label><input id="visitDate" type="date"></div><div><label>Contrôleur</label><input id="tech" list="controllerList" autocomplete="off" placeholder="Nom et prénom"><datalist id="controllerList"></datalist></div><div><label>Téléphone du contrôleur</label><input id="techPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 00 00 00 00"></div><div><label>Type de visite</label><select id="visitType"><option value="VFG">Visite de fin de garantie</option><option value="CONTROLE">Visite de contrôle</option></select></div><div><label>État global</label><select id="globalStatus"><option>Conforme</option><option>Observation</option><option>Réserve</option><option>Non conforme</option><option>Contrôle complémentaire nécessaire</option></select></div></div><div class="grid3"><div><label>Kilomètres porteur</label><input id="carrierKm" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex. 62 000"></div><div><label>Heures porteur</label><input id="carrierHours" type="text" inputmode="decimal" autocomplete="off" placeholder="Ex. 4 250"></div><div><label>Heures tourelle</label><input id="upperHours" type="text" inputmode="decimal" autocomplete="off" placeholder="Ex. 3 980"></div></div><label>Observations générales</label><textarea id="notes" rows="4" placeholder="Observations générales…"></textarea></div><div class="card"><h3>Points de contrôle</h3><div id="checks"></div></div><button id="saveVisit" class="btn primary full">Enregistrer la visite</button></section>
<section id="s-history" class="screen"><div class="card"><div class="row"><div><h2>Visites enregistrées</h2><div id="historyCount" class="meta"></div></div><button id="exportJson" class="btn secondary mini">Exporter</button></div><label>Filtrer l’historique</label><input id="historyFilter" type="search" placeholder="N° parc, technicien, agence…"><div id="allHistory"></div></div></section>
</main><nav class="nav"><button data-nav="search" class="active">Recherche</button><button data-nav="history">Visites</button></nav>
<script src="data/parc.js"></script>
<script src="data/agences.js"></script>
<script src="app.js"></script></body></html>
