<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f47721">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FOSELEV VFG V3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button id="backButton" class="icon-button hidden" type="button" aria-label="Retour">←</button>
    <a class="brand" href="#search" aria-label="Accueil FOSELEV VFG">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span><strong>FOSELEV</strong><small>VFG · V3.3.0</small></span>
    </a>
    <button id="helpButton" class="icon-button" type="button" aria-label="Aide">?</button>
  </header>

  <main class="app-shell">
    <section id="searchScreen" class="screen active" aria-labelledby="searchTitle">
      <div class="screen-heading">
        <p class="eyebrow">RECHERCHE MACHINE</p>
        <h1 id="searchTitle">Trouver une machine</h1>
      </div>

      <div class="search-card">
        <label for="machineSearch">N° de parc, série, modèle, constructeur ou agence</label>
        <div class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="machineSearch" type="search" autocomplete="off" placeholder="Ex. GM1135, 92874, LTM 1100…">
          <button id="clearSearch" class="clear-button hidden" type="button" aria-label="Effacer">×</button>
        </div>
      </div>

      <section class="section-block" aria-labelledby="recentTitle">
        <div class="section-title-row">
          <h2 id="recentTitle">Machines récentes</h2>
          <button id="clearRecents" class="text-button" type="button">Effacer</button>
        </div>
        <div id="recentMachines" class="machine-list"></div>
      </section>

      <section id="resultsSection" class="section-block hidden" aria-labelledby="resultsTitle">
        <div class="section-title-row">
          <h2 id="resultsTitle">Résultats</h2>
          <span id="resultCount" class="count-badge">0</span>
        </div>
        <div id="searchResults" class="machine-list"></div>
      </section>
    </section>

    <section id="dashboardScreen" class="screen" aria-labelledby="dashboardTitle">
      <div class="machine-summary">
        <p class="eyebrow">VISITE EN COURS</p>
        <h1 id="dashboardTitle">—</h1>
        <p id="dashboardSubtitle" class="muted">—</p>
      </div>

      <div class="dashboard-grid">
        <article class="dashboard-card" data-zone="carrier">
          <button class="dashboard-main" type="button" data-open-zone="carrier">
            <div class="machine-visual carrier-visual" aria-hidden="true"><span>🚛</span></div>
            <div class="dashboard-copy">
              <h2>Porteur</h2>
              <strong id="carrierProgress">0/0</strong>
            </div>
          </button>
          <button id="carrierNc" class="nc-button hidden" type="button" data-open-nc="carrier">NC 0/0</button>
        </article>

        <article class="dashboard-card" data-zone="upper">
          <button class="dashboard-main" type="button" data-open-zone="upper">
            <div class="machine-visual upper-visual" aria-hidden="true"><span>🏗️</span></div>
            <div class="dashboard-copy">
              <h2>Tourelle</h2>
              <strong id="upperProgress">0/0</strong>
            </div>
          </button>
          <button id="upperNc" class="nc-button hidden" type="button" data-open-nc="upper">NC 0/0</button>
        </article>
      </div>

      <button id="finishVisit" class="primary-action" type="button">Terminer la visite</button>
    </section>

    <section id="zoneScreen" class="screen" aria-labelledby="zoneTitle">
      <div class="zone-heading">
        <div>
          <p id="zoneEyebrow" class="eyebrow">LISTE DE CONTRÔLE</p>
          <h1 id="zoneTitle">Porteur</h1>
          <p id="zoneSubtitle" class="muted">—</p>
        </div>
        <div class="zone-total" aria-label="Avancement de la zone">
          <strong id="zoneProgress">0/0</strong>
          <span>restants / total</span>
        </div>
      </div>

      <div class="zone-toolbar">
        <label class="zone-search" for="sectionSearch">
          <span aria-hidden="true">⌕</span>
          <input id="sectionSearch" type="search" autocomplete="off" placeholder="Rechercher une rubrique…">
        </label>
        <button id="showZoneNc" class="zone-nc-summary hidden" type="button">NC 0</button>
      </div>

      <div id="sectionList" class="section-list"></div>
    </section>

    <section id="findingsScreen" class="screen" aria-labelledby="findingsTitle">
      <div class="screen-heading">
        <p class="eyebrow">CONSTATS</p>
        <h1 id="findingsTitle">Non-conformités</h1>
        <p id="findingsSubtitle" class="muted">—</p>
      </div>
      <div id="findingsList" class="findings-list"></div>
    </section>

    <section id="placeholderScreen" class="screen" aria-labelledby="placeholderTitle">
      <div class="placeholder-card">
        <p class="eyebrow">SPRINT SUIVANT</p>
        <h1 id="placeholderTitle">Module en préparation</h1>
        <p id="placeholderText">Cette zone sera développée dans le prochain sprint.</p>
        <button class="secondary-action" type="button" data-go-dashboard>Retour au tableau de bord</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="parc.js"></script>
  <script src="app-v3.3.js?v=330"></script>
</body>
</html>
